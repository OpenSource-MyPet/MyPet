<div class="form-container">
    <div class="form-header">
        <h1>반려동물 증상 진단 신청</h1>
        <p>반려동물의 증상을 자세히 알려주시면 AI가 빠르게 진단해드립니다</p>
    </div>

    <div class="form-card">
        <form action="/aiVet" method="POST" id="diagnosisForm" enctype="multipart/form-data">
            <!-- 반려동물 기본 정보 -->
            <div class="form-section">
                <label class="form-label">반려동물 정보<span class="required">*</span></label>
                <div class="pet-info-grid">
                    <input type="text" class="form-input" name = "name" placeholder="이름" id="petName" required>
                    <select class="form-select" name="type" id="petType" required>
                        <option value="">종류 선택</option>
                        <option value="dog">강아지</option>
                        <option value="cat">고양이</option>
                        <option value="other">기타</option>
                    </select>
                </div>
                <div class="pet-info-grid">
                    <input type="text" class="form-input" name="detail" placeholder="품종 (예: 말티즈)" id="petBreed">
                    <input type="number" class="form-input" name="age" placeholder="나이 (년)" id="petAge" min="0" max="30">
                </div>
            </div>

            <!-- 사진 업로드 -->
            <div class="form-section">
                <label class="form-label">증상 사진 업로드</label>
                <p class="form-description">반려동물의 증상이 보이는 부위를 촬영해주세요 (최소 1장)</p>

                <div class="photo-upload-area" id="photoUploadArea">
                    <div class="upload-icon">
                        <i class="fas fa-camera"></i>
                    </div>
                    <div class="upload-text">사진 업로드</div>
                    <div class="upload-hint">클릭하거나 드래그하여 사진을 추가하세요</div>
                    <input type="file" id="photoInput" name = "image" >
                </div>

                <div class="photo-preview-grid" id="photoPreviewGrid"></div>
            </div>

            <!-- 증상 상세 입력 -->
            <div class="form-section">
                <label class="form-label">증상 설명<span class="required">*</span></label>
                <p class="form-description">언제부터 어떤 증상이 나타났는지 자세히 작성해주세요</p>
                <textarea
                        class="symptom-textarea"
                        id="symptomDescription"
                        name="symptom"
                        placeholder="예시:
• 증상 발견 시기: 3일 전부터
• 주요 증상: 기침, 콧물, 식욕 감소
• 행동 변화: 평소보다 활동량이 줄고 자주 누워있음
• 기타 특이사항: 간헐적으로 재채기를 함"
                        maxlength="1000"
                        required
                ></textarea>
                <div class="char-count"><span id="charCount">0</span> / 1000</div>
            </div>

            <!-- 긴급도 선택 -->
            <div class="form-section">
                <label class="form-label">긴급도<span class="required">*</span></label>
                <div class="urgency-options">
                    <label class="urgency-option">
                        <input type="radio" name="urgency" value="low" required>
                        <span class="urgency-label">낮음</span>
                        <span class="urgency-desc">가벼운 증상</span>
                    </label>
                    <label class="urgency-option">
                        <input type="radio" name="urgency" value="medium" required>
                        <span class="urgency-label">보통</span>
                        <span class="urgency-desc">관찰이 필요함</span>
                    </label>
                    <label class="urgency-option">
                        <input type="radio" name="urgency" value="high" required>
                        <span class="urgency-label">높음</span>
                        <span class="urgency-desc">즉시 확인 필요</span>
                    </label>
                </div>
            </div>

            <!-- 제출 버튼 -->
            <div class="submit-section">
                <button type="button" class="cancel-btn">취소</button>
                <button type="submit" class="submit-btn">
                    진단 신청하기
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    document.getElementById('diagnosisForm').addEventListener('submit', (e) =>{
        if(photoInput.files.length ===0){
            e.preventDefault()
            console.log("warning image")
        }
    })
    // 네비게이션 활성화
    document.querySelectorAll('.header-nav-item').forEach(item => {
        item.addEventListener('click', function() {
            document.querySelectorAll('.header-nav-item').forEach(i => i.classList.remove('active'));
            this.classList.add('active');
        });
    });

    document.getElementById("header-ai").classList.add("active")

    // 사진 업로드 관련
    const photoUploadArea = document.getElementById('photoUploadArea');
    const photoInput = document.getElementById('photoInput');
    const photoPreviewGrid = document.getElementById('photoPreviewGrid');
    let uploadedPhotos = [];

    photoUploadArea.addEventListener('click', () => photoInput.click());

    photoInput.addEventListener('change', handlePhotoSelect);

    // 드래그 앤 드롭
    photoUploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        photoUploadArea.classList.add('dragover');
    });

    photoUploadArea.addEventListener('dragleave', () => {
        photoUploadArea.classList.remove('dragover');
    });

    photoUploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        photoUploadArea.classList.remove('dragover');
        const files = Array.from(e.dataTransfer.files).filter(file => file.type.startsWith('image/'));
        handleFiles(files);
    });

    function handlePhotoSelect(e) {
        const files = Array.from(e.target.files);
        handleFiles(files);
        // photoInput.value = '';
    }

    function handleFiles(files) {
        if (uploadedPhotos.length + files.length > 5) {
            alert('최대 5장까지 업로드할 수 있습니다.');
            return;
        }

        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedPhotos.push({
                    src: e.target.result,
                    file: file
                });
                renderPhotoPreviews();
            };
            reader.readAsDataURL(file);
        });
    }

    function renderPhotoPreviews() {
        photoPreviewGrid.innerHTML = '';
        uploadedPhotos.forEach((photo, index) => {
            const item = document.createElement('div');
            item.className = 'photo-preview-item';
            item.innerHTML = `
                    <img src="${photo.src}" class="photo-preview-img" alt="Preview">
                    <button type="button" class="photo-remove-btn" onclick="removePhoto(${index})">
                        <i class="fas fa-times"></i>
                    </button>
                `;
            photoPreviewGrid.appendChild(item);
        });
    }

    window.removePhoto = function(index) {
        uploadedPhotos.splice(index, 1);
        renderPhotoPreviews();
    };

    // 글자 수 카운트
    const symptomDescription = document.getElementById('symptomDescription');
    const charCount = document.getElementById('charCount');

    symptomDescription.addEventListener('input', () => {
        charCount.textContent = symptomDescription.value.length;
    });

    // 긴급도 선택
    document.querySelectorAll('.urgency-option').forEach(option => {
        option.addEventListener('click', function() {
            document.querySelectorAll('.urgency-option').forEach(opt => opt.classList.remove('selected'));
            this.classList.add('selected');
            this.querySelector('input').checked = true;
        });
    });

    // 취소 버튼
    document.querySelector('.cancel-btn').addEventListener('click', () => {
        if (confirm('작성을 취소하시겠습니까?')) {
