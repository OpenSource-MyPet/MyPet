    <style>
        /*html, body { height: 100%; margin: 0; }*/

            height: 64px;

        /* 오버레이 카드 */
        .ov-wrap {
            position: relative;

    <!-- Kakao JS SDK 로드 -->
    <script>
        (function loadKakao(){
            const s=document.createElement('script');
            s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey=f9dabfab3e52a805008e3beea7d3a98b&autoload=false';
            s.onload=function(){ kakao.maps.load(initMap); };
            s.onerror=function(){ alert('카카오 SDK 로드 실패(키/도메인/네트워크 확인)'); };
            document.head.appendChild(s);
        })();
    </script>

    <script>
        let map, openOverlay=null;
        let data = null ;
        let locdata = null;
        /* 🐱 귀여운 고양이 아이콘 SVG */
        const CAT_SVG = encodeURIComponent(`
      <svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'>
        <!-- 바깥 동그란 배경 -->
        <circle cx='20' cy='20' r='18' fill='white' stroke='#fbbf24' stroke-width='2'/>

        <!-- 고양이 귀 -->
        <path d='M10 14 L14 6 L18 14 Z' fill='#fde68a' stroke='#f59e0b' stroke-width='1'/>
        <path d='M22 14 L26 6 L30 14 Z' fill='#fde68a' stroke='#f59e0b' stroke-width='1'/>

        <!-- 얼굴 -->
        <circle cx='20' cy='20' r='10' fill='#facc15' stroke='#eab308' stroke-width='1.5'/>

        <!-- 눈 -->
        <circle cx='17' cy='18' r='1.4' fill='#111827'/>
        <circle cx='23' cy='18' r='1.4' fill='#111827'/>

        <!-- 코 -->
        <path d='M19 20 L21 20 L20 21.5 Z' fill='#f97316'/>

        <!-- 입 -->
        <path d='M20 21.5 Q18.8 22.8 17.5 22' stroke='#78350f' stroke-width='1' fill='none'/>
        <path d='M20 21.5 Q21.2 22.8 22.5 22' stroke='#78350f' stroke-width='1' fill='none'/>

        <!-- 수염 -->
        <path d='M14 19.5 L11 18.8' stroke='#78350f' stroke-width='0.9'/>
        <path d='M14 21 L11 21' stroke='#78350f' stroke-width='0.9'/>
        <path d='M26 19.5 L29 18.8' stroke='#78350f' stroke-width='0.9'/>
        <path d='M26 21 L29 21' stroke='#78350f' stroke-width='0.9'/>
      </svg>
    `);

        /* 고양이 마커 이미지 생성 */
        function makeMarkerImage() {
            return new kakao.maps.MarkerImage(
                "data:image/svg+xml;charset=UTF-8," + CAT_SVG,
                new kakao.maps.Size(40, 40),
                { offset: new kakao.maps.Point(20, 40) }
            );
        }

        // ------------------- 지도 초기화 -------------------
        function initMap(){
            const container=document.getElementById('map');
            const center=new kakao.maps.LatLng(36.632473,127.453143);
            map=new kakao.maps.Map(container,{center,level:5});

            if(navigator.geolocation){
                navigator.geolocation.getCurrentPosition(pos=>{
                    const cur=new kakao.maps.LatLng(pos.coords.latitude,pos.coords.longitude);
                    map.setCenter(cur);
                    locdata = cur
                    new kakao.maps.Marker({position:cur}).setMap(map);
                    fetchHospitalsAndRender(cur.getLat(), cur.getLng(), 3000);

                },_=>{
                    fetchHospitalsAndRender(center.getLat(), center.getLng(), 3000);
                },{enableHighAccuracy:true,timeout:5000});
            }else{
                fetchHospitalsAndRender(center.getLat(), center.getLng(), 3000);
            }
        }


        // ------------------- 병원 데이터 가져오기 -------------------
        function fetchHospitalsAndRender(lat,lng,radius){
            const url=`/api/hospitals?lat=${lat}&lng=${lng}&radius=${radius||3000}`;
            fetch(url)
                .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
                .then(json=>{
                    const arr = json.items ? json.items : json;
                    console.log(arr);
                    data = arr;

                    const local = document.querySelector('.place-list')
                    if(local){
                        makeList(data)
                    }
                    else{
                        document.addEventListener('DOMContentLoaded', () => {makeList(data)})
                    }
                    renderMarkers(arr);

                })
                .catch(err=>{
                    console.warn('서버 실패 → mock 사용', err);
                    fetch('/api/hospitals/mock').then(r=>r.json()).then(j=>renderMarkers(j.items||[]))
                        .catch(()=>alert('병원 데이터를 불러오지 못했습니다.'));
                });
        }

        // ------------------- 마커 표시 -------------------
        function renderMarkers(list){
            list.forEach(h=>{
                const pos=new kakao.maps.LatLng(h.lat, h.lng);
                const marker=new kakao.maps.Marker({
                    position:pos,
                    image:makeMarkerImage(),
                    zIndex:1
                });
                marker.setMap(map);
                kakao.maps.event.addListener(marker,'click',()=>openHospitalOverlay(marker,h));
            });
        }

        // ------------------- 오버레이 (닫기 가능) -------------------
        function openHospitalOverlay(marker,h){
            if(openOverlay){ openOverlay.setMap(null); openOverlay=null; }

            const wrap=document.createElement('div');
            wrap.className='ov-wrap';
            wrap.innerHTML=`
        <button class="ov-close" title="닫기">✕</button>
        <h3 class="ov-title">${escapeHtml(h.name)}</h3>
        <div class="ov-txt">${escapeHtml(h.address||'주소 정보 없음')}</div>
        <div class="ov-txt">${escapeHtml(h.phone||'전화번호 없음')}</div>
        <div class="btns">
          <a class="btn" target="_blank"
             href="https://map.kakao.com/link/to/${encodeURIComponent(h.name)},${h.lat},${h.lng}">길찾기</a>
          <a class="btn" target="_blank"
             href="https://map.kakao.com/link/map/${encodeURIComponent(h.name)},${h.lat},${h.lng}">카카오맵</a>
        </div>
      `;

            const ov=new kakao.maps.CustomOverlay({
                content:wrap,
                position:marker.getPosition(),
                xAnchor:0.5,
                yAnchor:1.05,
                zIndex:999
            });
            ov.setMap(map);
            openOverlay=ov;
            wrap.querySelector('.ov-close').onclick=()=>{ ov.setMap(null); openOverlay=null; };
        }

        function escapeHtml(s){
            return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }
    </script>
</head>

<script>
    console.log("data is " + data)
    const makeList = (arr) => {

        const locationList = document.querySelector('.place-list');

        arr.forEach(loc=>{
            const newloc = document.createElement('div');
            newloc.className = "place-item"
            newloc.dataset.name = loc.name
            newloc.dataset.lat = loc.lat
            newloc.dataset.lng = loc.lng
            console.log(loc.lat + " " + loc.lng)
            // "https://map.kakao.com/link/to/${encodeURIComponent(h.name)},${h.lat},${h.lng}"
            // console.log(encodeURIComponent())
            if(loc.phone === "") loc.phone = "전화번호 없음"
            newloc.innerHTML = `<div class="place-header">
                    <div class="place-name">${loc.name}</div>
                    <div class="place-category"><i class="fas fa-hospital-user"></i> 동물병원</div>
                </div>
                <div class="place-address">${loc.address}</div>
                <div class="place-info">
<!--                    <span><i class="fas fa-star" style="color: #ffd500;"></i> 4.8</span>-->
                    <span id = "phone-number"><i class="fas fa-phone"></i> ${loc.phone}</span>
<!--                    <span><i class="fas fa-clock"></i> 08:00 - 19:00</span>-->
                </div>`
            locationList.append(newloc)
        })
    }

    document.querySelector('.place-list').addEventListener('click', (e) => {
        const item = e.target.closest('.place-item')
        if(!item) return
        document.querySelectorAll('.place-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active')
        const name = item.querySelector('.place-name').textContent
        const address = item.querySelector('.place-address').textContent
        let phone = item.querySelector('#phone-number').textContent
        if(phone === " "){
            phone = "전화번호 없음"
        }
        const lat = item.getAttribute('data-lat')
        const lng = item.getAttribute('data-lng')
        console.log(name)
        console.log(address)
        console.log(phone)
        console.log(lat)
        console.log(lng)

        document.querySelector('.detail-title').textContent = name
        document.querySelector('#detail-address').textContent = address
        document.querySelector('#detail-phone').textContent = phone
        document.querySelector(".primary-btn").addEventListener('click', () => {
            location.href = `https://map.kakao.com/link/to/${encodeURIComponent(name)},${lat},${lng}`
        })

        document.getElementById('detailCard').classList.add('show')
    })

            const searchTerm = this.value.toLowerCase();
            document.querySelectorAll('.place-item').forEach(item => {
                const placeName = item.querySelector('.place-name').textContent.toLowerCase();
                if (placeName.includes(searchTerm)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }

    document.getElementById("header-map").classList.add('active')
    document.querySelector('.search-btn').addEventListener('click', function() {
        const searchTerm = document.querySelector('.search-input').value.toLowerCase();
