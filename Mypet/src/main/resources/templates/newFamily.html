<script th:inline="javascript">
    document.getElementById("header-animals").classList.add('active')
    const curpage = [[${page}]]
    const gofront = () => {
        location.href = `/animals?pageNo=${curpage+1}`
    }
    const goback = () => {
        if(curpage > 1)
        location.href = `/animals?pageNo=${curpage-1}`
        else{
            location.href = `/animals?pageNo=${curpage}`
        }
    }
    document.getElementsByName('page-btn').forEach(page=>{
        if(page.textContent === String(curpage)){
            page.classList.add('active')
        }
        page.addEventListener('click', () => {
            const pageNo = page.textContent
            location.href = `/animals?pageNo=${pageNo}`

        })
    })
    // 필터 기능
    const filterButtons = document.querySelectorAll('.filter-btn');
    const animalCards = document.querySelectorAll('.animal-card');

    document.querySelectorAll('.animal-card').forEach(card=>{
        const id = card.dataset.id
        card.addEventListener('click', () => {
            location.href = `/animals/${id}`

        })
    })

    // 페이지네이션 버튼 업데이트
    const pageButtons = document.querySelectorAll('.pagination-btn');
    pageButtons.forEach((btn, index) => {
        btn.classList.remove('active');

        // 이전/다음 버튼 활성화/비활성화
        if (index === 0) { // 이전 버튼
            btn.disabled = (currentPage === 1);
        } else if (index === 3) { // 다음 버튼
            btn.disabled = (currentPage === 2);
        } else if (index === currentPage) { // 페이지 번호 버튼
            btn.classList.add('active');
        }
    });


    filterButtons.forEach(button => {
        button.addEventListener('click', function() {
            // 모든 버튼의 active 클래스 제거
            filterButtons.forEach(btn => btn.classList.remove('active'));

            // 클릭된 버튼에 active 클래스 추가
            this.classList.add('active');

            // 필터 값 가져오기
            const filterValue = this.getAttribute('data-filter');

            // 카드 필터링
            animalCards.forEach(card => {
                const cardType = card.getAttribute('data-type');

                if (filterValue === 'all') {
                    card.classList.remove('hidden');
                } else if (cardType === filterValue) {
                    card.classList.remove('hidden');
                } else {
                    card.classList.add('hidden');
                }
            });
        });
    });



    // 헤더 네비게이션 탭 전환
    document.querySelectorAll('.header-nav-item').forEach(item => {
        item.addEventListener('click', function() {
            document.querySelectorAll('.header-nav-item').forEach(i => i.classList.remove('active'));
            this.classList.add('active');
        });
    });
</script>
