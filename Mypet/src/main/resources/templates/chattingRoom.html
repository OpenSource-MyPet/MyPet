<script th:inline="javascript">

    const darkmode = () => {
        document.body.classList.toggle('dark')
    }
    const lightmode = () => {
        document.body.classList.remove('dark')
    }

    const userId = /*[[${user.id}]]*/ ""
    const nickname = /*[[${user.nickname}]]*/ ""
    console.log("userid : "+ userId)
    console.log("nickname : " + nickname)
    // 네비게이션 탭 전환
    document.querySelectorAll('.header-nav-item').forEach(item => {
        item.addEventListener('click', function() {
            document.querySelectorAll('.header-nav-item').forEach(i => i.classList.remove('active'));
            this.classList.add('active');
        });
    });
    document.getElementById("header-openchat").classList.add("active")


    let stompClient = null ;
    let roomId = null ;

    // console.log(document.getElementById("chat-area").getAttribute("data-roomId"))

    let connect = () => {
        roomId = document.getElementById("chat-area").getAttribute("data-roomId")
        const socket = new SockJS('/ws')
        stompClient = Stomp.over(socket)

        stompClient.connect({}, function (frame){
            console.log("Connected : " + frame)
            stompClient.subscribe('/topic/' + roomId, function (msg){
                const message = JSON.parse(msg.body)
                if(message.sender == nickname) return ;
                messageHandler(message)

            })
            showAddMessage();
        })
    }

    const messageHandler = (message) => {
        if(message.type === 'CHAT'){
            showMessage(message.sender, message.content)
        }
        else if(message.type === 'JOIN'){
            showAddNotification(message.sender, 1)
        }
        else if(message.type === 'LEAVE'){
            showAddNotification(message.sender, 0)
        }
    }
    const showAddNotification = (username, flag) => {
        const messagesContainer = document.getElementById('chatMessages');
        const now = new Date();
        const timeString = `${now.getHours() > 12 ? '오후' : '오전'} ${now.getHours() % 12 || 12}:${String(now.getMinutes()).padStart(2, '0')}`;
        const message = flag === 1 ? username + "님이 입장하셨습니다." : username + "님이 퇴장하셨습니다."

        const messageHTML = `<div class="date-divider">
                <span>${message}</span>
            </div>`;

        messagesContainer.insertAdjacentHTML('beforeend', messageHTML);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    const showAddMessage = () => {
        const messagesContainer = document.getElementById('chatMessages');
        const now = new Date();
        const timeString = `오후 ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
        const message = nickname + "님이 입장하셨습니다."
        userAddMessage()

        const messageHTML = `<div class="date-divider">
                <span>${message}</span>
            </div>`;

        messagesContainer.insertAdjacentHTML('beforeend', messageHTML);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    const userAddMessage = () => {
        stompClient.send('/app/chat.addUser', {}, JSON.stringify({
            sender: nickname,
            roomId : roomId
        }))
    }

    const showMessage = (sender, content) => {
        const messagesContainer = document.getElementById('chatMessages');
        const now = new Date();
        const timeString = `오후 ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;

        const messageHTML = `<div class="message">
                <div class="message-avatar">
                    <img src="https://ssoads.co.kr/common/img/default_profile.png" alt="">
                </div>
                <div class="message-content">
                    <div class="message-sender">${sender}</div>
                    <div class="message-bubble">${content}</div>
                    <div class="message-time">${timeString}</div>
                </div>
            </div>`;

        messagesContainer.insertAdjacentHTML('beforeend', messageHTML);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    // 메시지 전송 기능
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();

        if (message) {
            const messagesContainer = document.getElementById('chatMessages');
            const now = new Date();
            const timeString = `오후 ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
            stompClient.send('/app/chat.sendMessage', {}, JSON.stringify({
                sender: nickname,
                content : message,
                roomId : roomId
            }))

            const messageHTML = `
                    <div class="message own">
                        <div class="message-content">
                            <div class="message-bubble">${message}</div>
                            <div class="message-time">${timeString}</div>
                        </div>
                    </div>
                `;

            messagesContainer.insertAdjacentHTML('beforeend', messageHTML);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            input.value = '';
        }
    }
    const leaveRoom = () => {
        if(stompClient && stompClient.connected){
            stompClient.send("/app/chat.leave" , {}, JSON.stringify({
                sender : nickname,
                roomId : roomId
            }))
            stompClient.disconnect()
        }

    }

    window.onload = connect

    window.addEventListener("beforeunload", () => {
        leaveRoom()
    })

    const quitRoom = () => {
        leaveRoom()
        location.href = '/openchat'
    }


    // Enter 키로 메시지 전송
    document.getElementById('messageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    // 페이지 로드 시 스크롤을 맨 아래로
    document.addEventListener('DOMContentLoaded', function() {
        const messagesContainer = document.getElementById('chatMessages');
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });
</script>
