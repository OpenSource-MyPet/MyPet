<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>🐾 MyPet 지도 | 주변 동물병원</title>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { width: 100%; height: calc(100vh - 64px); background: #f6f6f6; }
    .bar {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      font-weight: 700;
      background: #fff;
      box-shadow: 0 1px 6px rgba(0,0,0,.06);
    }

    /* =============== 오버레이 카드 (조금 더 작게) =============== */
    .ov-wrap {
      position: relative;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 16px 32px rgba(15,23,42,.22);
      padding: 22px 18px 14px;
      width: 280px;
      text-align: center;
    }

    /* 고양이 동그란 뱃지 (위에 살짝 작은 원) */
    .ov-avatar {
      position: absolute;
      left: 50%;
      top: -24px;
      transform: translateX(-50%);
      width: 52px;
      height: 52px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 10px 20px rgba(15,23,42,.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ov-avatar img {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: block;
    }

    /* 병원 이미지 썸네일 컨테이너 */
    .ov-thumb-container {
      width: 100%;
      height: 130px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
    }

    /* 병원 건물 SVG 스타일 */
    .hospital-icon {
      width: 100px;
      height: 100px;
      stroke: #111827;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .hospital-icon .building-body { fill: #fde68a; }
    .hospital-icon .wing-body     { fill: #fde68a; }
    .hospital-icon .roof          { fill: #fed7aa; }
    .hospital-icon .window        { fill: #93c5fd; }
    .hospital-icon .door          { fill: #e5e7eb; }
    .hospital-icon .cross-circle  { fill: #ef4444; }
    .hospital-icon .cross-plus    { fill: #ffffff; stroke: none; }

    .ov-title {
      font-size: 16px;
      font-weight: 800;
      margin: 4px 0 3px;
      color: #111827;
    }
    .ov-txt {
      font-size: 13px;
      color: #4b5563;
      line-height: 1.5;
      margin: 1px 0;
    }

    .ov-close {
      position: absolute;
      right: 12px;
      top: 10px;
      border: 0;
      background: transparent;
      font-size: 18px;
      cursor: pointer;
      color: #9ca3af;
    }

    .btns {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }
    .btn {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #c7d2fe;
      font-size: 13px;
      font-weight: 500;
      background: #f9fafb;
      cursor: pointer;
      color: #2563eb;
      text-decoration: none;
      min-width: 70px;
    }
    .btn:hover {
      background: #eff6ff;
    }
  </style>

  <!-- Kakao JS SDK 로드 -->
  <script>
    (function loadKakao(){
      const s=document.createElement('script');
      s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey=f9dabfab3e52a805008e3beea7d3a98b&autoload=false';
      s.onload=function(){ kakao.maps.load(initMap); };
      s.onerror=function(){ alert('카카오 SDK 로드 실패(키/도메인/네트워크 확인)'); };
      document.head.appendChild(s);
    })();
  </script>

  <script>
    let map, openOverlay=null;

    /* 고양이 SVG (마커 + 아바타 공통 느낌) */
    const CAT_SVG = encodeURIComponent(`
      <svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'>
        <circle cx='20' cy='20' r='20' fill='white'/>
        <!-- 머리 -->
        <path d='M10 18 Q10 11 16 11 L24 11 Q30 11 30 18 L30 23 Q30 28 25 30 Q20 32 15 30 Q10 28 10 23 Z'
              fill='#facc15' stroke='#111827' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/>
        <!-- 귀 -->
        <path d='M14 11 L11 7 L11 13' fill='#facc15' stroke='#111827' stroke-width='1.4' stroke-linejoin='round'/>
        <path d='M26 11 L29 7 L29 13' fill='#facc15' stroke='#111827' stroke-width='1.4' stroke-linejoin='round'/>
        <!-- 눈 -->
        <circle cx='16' cy='19' r='1.4' fill='#111827'/>
        <circle cx='24' cy='19' r='1.4' fill='#111827'/>
        <!-- 코 -->
        <path d='M19 20.5 L21 20.5 L20 21.8 Z' fill='#111827'/>
        <!-- 입 -->
        <path d='M20 21.8 Q18.8 23 17.4 22.6' stroke='#111827' stroke-width='1.2' fill='none' stroke-linecap='round'/>
        <path d='M20 21.8 Q21.2 23 22.6 22.6' stroke='#111827' stroke-width='1.2' fill='none' stroke-linecap='round'/>
        <!-- 수염 -->
        <path d='M15 19.5 L11.5 18.8' stroke='#111827' stroke-width='1' stroke-linecap='round'/>
        <path d='M15 21.2 L11.5 21.4' stroke='#111827' stroke-width='1' stroke-linecap='round'/>
        <path d='M25 19.5 L28.5 18.8' stroke='#111827' stroke-width='1' stroke-linecap='round'/>
        <path d='M25 21.2 L28.5 21.4' stroke='#111827' stroke-width='1' stroke-linecap='round'/>
        <!-- 이마 줄무늬 -->
        <path d='M19 15 L19 16.2' stroke='#b45309' stroke-width='1.2' stroke-linecap='round'/>
        <path d='M17 14.8 L16.5 15.8' stroke='#b45309' stroke-width='1.2' stroke-linecap='round'/>
        <path d='M23 14.8 L23.5 15.8' stroke='#b45309' stroke-width='1.2' stroke-linecap='round'/>
      </svg>
    `);

    /* 고양이 마커 이미지 생성 (아주 살짝 크게 32x32) */
    function makeMarkerImage() {
      return new kakao.maps.MarkerImage(
        "data:image/svg+xml;charset=UTF-8," + CAT_SVG,
        new kakao.maps.Size(32, 32),           // ← 여기 크기
        { offset: new kakao.maps.Point(16, 32) } // 중심/바닥 맞춰주는 오프셋
      );
    }

    // ------------------- 지도 초기화 -------------------
    function initMap(){
      const container=document.getElementById('map');
      const center=new kakao.maps.LatLng(36.632473,127.453143);
      map=new kakao.maps.Map(container,{center,level:5});

      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(pos=>{
          const cur=new kakao.maps.LatLng(pos.coords.latitude,pos.coords.longitude);
          map.setCenter(cur);
          new kakao.maps.Marker({position:cur}).setMap(map);
          fetchHospitalsAndRender(cur.getLat(), cur.getLng(), 3000);
        },_=>{
          fetchHospitalsAndRender(center.getLat(), center.getLng(), 3000);
        },{enableHighAccuracy:true,timeout:5000});
      }else{
        fetchHospitalsAndRender(center.getLat(), center.getLng(), 3000);
      }
    }

    // ------------------- 병원 데이터 가져오기 -------------------
    function fetchHospitalsAndRender(lat,lng,radius){
      const url=`/api/hospitals?lat=${lat}&lng=${lng}&radius=${radius||3000}`;
      fetch(url)
        .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(json=>{
          const arr = json.items ? json.items : json;
          renderMarkers(arr);
        })
        .catch(err=>{
          console.warn('서버 실패 → mock 사용', err);
          fetch('/api/hospitals/mock').then(r=>r.json()).then(j=>renderMarkers(j.items||[]))
          .catch(()=>alert('병원 데이터를 불러오지 못했습니다.'));
        });
    }

    // ------------------- 마커 표시 -------------------
    function renderMarkers(list){
      list.forEach(h=>{
        const pos=new kakao.maps.LatLng(h.lat, h.lng);
        const marker=new kakao.maps.Marker({
          position:pos,
          image:makeMarkerImage(),
          zIndex:1
        });
        marker.setMap(map);
        kakao.maps.event.addListener(marker,'click',()=>openHospitalOverlay(marker,h));
      });
    }

    // ------------------- 오버레이 (닫기 가능) -------------------
    function openHospitalOverlay(marker,h){
      if(openOverlay){ openOverlay.setMap(null); openOverlay=null; }

      const wrap=document.createElement('div');
      wrap.className='ov-wrap';
      wrap.innerHTML=`
        <button class="ov-close" title="닫기">✕</button>

        <!-- 고양이 동글 뱃지 -->
        <div class="ov-avatar">
          <img src="data:image/svg+xml;charset=UTF-8,${CAT_SVG}" alt="cat">
        </div>

        <!-- 병원 건물 아이콘 -->
        <div class="ov-thumb-container">
          <svg class="hospital-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <rect class="building-body" x="20" y="30" width="60" height="60" rx="8" ry="8"/>
            <rect class="wing-body" x="5" y="55" width="15" height="35" rx="4" ry="4"/>
            <rect class="wing-body" x="80" y="55" width="15" height="35" rx="4" ry="4"/>

            <path class="roof" d="M20 30 L20 25 A5 5 0 0 1 25 20 L75 20 A5 5 0 0 1 80 25 L80 30 Z"/>

            <circle class="cross-circle" cx="50" cy="18" r="9"/>
            <rect class="cross-plus" x="48" y="12" width="4" height="12" rx="1" ry="1"/>
            <rect class="cross-plus" x="44.5" y="15" width="11" height="4" rx="1" ry="1"/>

            <rect class="window" x="30" y="40" width="15" height="15" rx="3" ry="3"/>
            <rect class="window" x="55" y="40" width="15" height="15" rx="3" ry="3"/>
            <rect class="window" x="30" y="60" width="15" height="15" rx="3" ry="3"/>
            <rect class="window" x="55" y="60" width="15" height="15" rx="3" ry="3"/>

            <rect class="door" x="45" y="76" width="10" height="14" rx="2" ry="2"/>

            <rect class="window" x="9" y="60" width="7" height="10" rx="2" ry="2"/>
            <rect class="window" x="84" y="60" width="7" height="10" rx="2" ry="2"/>
          </svg>
        </div>

        <h3 class="ov-title">${escapeHtml(h.name)}</h3>
        <div class="ov-txt">${escapeHtml(h.address||'주소 정보 없음')}</div>
        <div class="ov-txt">${escapeHtml(h.phone||'전화번호 없음')}</div>
        <div class="btns">
          <a class="btn" target="_blank"
             href="https://map.kakao.com/link/to/${encodeURIComponent(h.name)},${h.lat},${h.lng}">길찾기</a>
          <a class="btn" target="_blank"
             href="https://map.kakao.com/link/map/${encodeURIComponent(h.name)},${h.lat},${h.lng}">카카오맵</a>
        </div>
      `;

      const ov=new kakao.maps.CustomOverlay({
        content:wrap,
        position:marker.getPosition(),
        xAnchor:0.5,
        yAnchor:1.05,
        zIndex:999
      });
      ov.setMap(map);
      openOverlay=ov;
      wrap.querySelector('.ov-close').onclick=()=>{ ov.setMap(null); openOverlay=null; };
    }

    function escapeHtml(s){
      return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
  </script>
</head>
<body>
  <div class="bar">🐾 MyPet 지도 | 주변 동물병원</div>
  <div id="map"></div>
</body>
</html>
